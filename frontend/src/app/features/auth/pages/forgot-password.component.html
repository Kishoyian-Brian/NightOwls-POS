<div class="min-h-screen bg-gray-400 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-sm p-8">
  
      <div class="flex flex-col items-center mb-8">
        <div class="w-14 h-14 bg-teal-600 rounded-full flex items-center justify-center mb-3">
          <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Reset Password</h1>
        <p class="text-sm text-gray-500 mt-1">Enter your username and new password</p>
      </div>
  
      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-4">
        {{ error }}
      </div>
      <div *ngIf="success" class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3 mb-4">
        {{ success }}
      </div>
  
      <form (ngSubmit)="onReset()">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input type="text" [(ngModel)]="username" name="username"
            placeholder="Enter username"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword"
            placeholder="New password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
            placeholder="Confirm password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
        </div>
        <button type="submit"
          class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
          Reset Password
        </button>
      </form>
  
      <div class="text-center mt-4">
        <a routerLink="/login" class="text-sm text-teal-600 hover:underline">Back to Login</a>
      </div>
  
    </div>
  </div>
