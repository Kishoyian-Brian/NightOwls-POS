<div class="min-h-screen bg-gray-400 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-sm p-8">
  
      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center mb-3">
          <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">ClubMaster</h1>
        <p class="text-sm text-gray-500 mt-1">Sign in to your account</p>
      </div>
  
      <!-- Error -->
      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-4">
        {{ error }}
      </div>
  
      <!-- Form -->
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Enter username"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
  
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="Enter password"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10"
            />
            <button type="button" (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                <path *ngIf="showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 012.05-3.37M6.53 6.53A9.97 9.97 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.97 9.97 0 01-4.617 5.42M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>
  
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
          Sign In
        </button>
      </form>
  
      <div class="text-center mt-4">
        <a routerLink="/forgot-password" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
      </div>

      <p class="text-xs text-gray-400 text-center mt-6 leading-relaxed">
        System access: <strong class="text-gray-500">waiter</strong>,
        <strong class="text-gray-500">bartender</strong> (bar),
        <strong class="text-gray-500">kitchen</strong>,
        <strong class="text-gray-500">store</strong>, or <strong class="text-gray-500">manager</strong>.
        All other staff are tracked under Employees — no login.
      </p>
  
    </div>
  </div>
