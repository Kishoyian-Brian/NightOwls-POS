<div class="p-4 md:p-8">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Inventory</h1>
    <p class="text-gray-500 text-sm mt-1">Stock levels — low stock threshold: {{ threshold }}</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let item of items"
         class="bg-white rounded-2xl shadow-md p-4 border-l-4"
         [class.border-red-400]="isLow(item)"
         [class.border-green-400]="!isLow(item)">
      <div class="flex items-start justify-between gap-2">
        <div>
          <p class="font-bold text-gray-800">{{ item.name }}</p>
          <p class="text-xs text-gray-400 capitalize">{{ item.itemType }} · {{ item.category }}</p>
        </div>
        <span *ngIf="isLow(item)" class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-red-100 text-red-600">
          Low
        </span>
      </div>
      <p class="text-3xl font-bold mt-3"
         [class.text-red-500]="isLow(item)"
         [class.text-gray-800]="!isLow(item)">
        {{ item.stock }}
      </p>
      <div class="flex items-center gap-2 mt-3">
        <input type="number" [(ngModel)]="restockAmount[item.id]" min="1"
               class="w-20 px-2 py-1.5 border rounded-lg text-sm"/>
        <button type="button" (click)="restock(item)"
                class="flex-1 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-lg hover:bg-indigo-700">
          Restock
        </button>
      </div>
    </div>
  </div>
</div>
