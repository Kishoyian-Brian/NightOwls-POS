<div class="p-4 md:p-8">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Products</h1>
      <p class="text-gray-500 text-sm mt-1">Manage menu items</p>
    </div>
    <button type="button" (click)="openAdd()"
            class="px-4 py-2 bg-teal-600 text-white text-sm font-semibold rounded-xl hover:bg-teal-700">
      + Add Product
    </button>
  </div>

  <div class="flex gap-2 mb-4">
    <button *ngFor="let f of ['all', 'food', 'drinks']"
            type="button"
            (click)="filter = $any(f)"
            class="px-4 py-2 rounded-full text-sm font-medium capitalize transition-colors"
            [class.bg-teal-600]="filter === f"
            [class.text-white]="filter === f"
            [class.bg-gray-100]="filter !== f"
            [class.text-gray-600]="filter !== f">
      {{ f }}
    </button>
  </div>

  <div class="bg-white rounded-2xl shadow-md overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
        <tr>
          <th class="text-left px-4 py-3">Name</th>
          <th class="text-left px-4 py-3 hidden sm:table-cell">Type</th>
          <th class="text-left px-4 py-3 hidden md:table-cell">Category</th>
          <th class="text-right px-4 py-3">Price</th>
          <th class="text-right px-4 py-3 hidden sm:table-cell">Stock</th>
          <th class="text-center px-4 py-3">Active</th>
          <th class="text-right px-4 py-3">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of filtered" class="border-t border-gray-100">
          <td class="px-4 py-3 font-medium text-gray-800">{{ p.name }}</td>
          <td class="px-4 py-3 capitalize text-gray-500 hidden sm:table-cell">{{ p.itemType }}</td>
          <td class="px-4 py-3 capitalize text-gray-500 hidden md:table-cell">{{ p.category }}</td>
          <td class="px-4 py-3 text-right text-teal-600 font-semibold">KES {{ p.price }}</td>
          <td class="px-4 py-3 text-right hidden sm:table-cell">{{ p.stock }}</td>
          <td class="px-4 py-3 text-center">
            <button type="button" (click)="toggleActive(p)"
                    class="text-xs font-semibold px-2 py-1 rounded-full"
                    [class.bg-green-100]="p.active"
                    [class.text-green-700]="p.active"
                    [class.bg-gray-100]="!p.active"
                    [class.text-gray-500]="!p.active">
              {{ p.active ? 'Yes' : 'No' }}
            </button>
          </td>
          <td class="px-4 py-3 text-right space-x-2">
            <button type="button" (click)="openEdit(p)" class="text-teal-600 text-xs font-semibold">Edit</button>
            <button type="button" (click)="deleteProduct(p)" class="text-red-500 text-xs font-semibold">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="filtered.length === 0" class="text-center text-gray-400 py-8">No products found</p>
  </div>
</div>

<!-- Form modal -->
<div *ngIf="showForm" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4">{{ editing ? 'Edit Product' : 'Add Product' }}</h2>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-500">Name</label>
        <input [(ngModel)]="form.name" class="w-full mt-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-gray-500">Type</label>
          <select [(ngModel)]="form.itemType" (ngModelChange)="onTypeChange()"
                  class="w-full mt-1 px-3 py-2 border rounded-xl text-sm">
            <option value="food">Food</option>
            <option value="drinks">Drinks</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Category</label>
          <select [(ngModel)]="form.category" class="w-full mt-1 px-3 py-2 border rounded-xl text-sm">
            <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-gray-500">Price (KES)</label>
          <input type="number" [(ngModel)]="form.price" min="1"
                 class="w-full mt-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Stock</label>
          <input type="number" [(ngModel)]="form.stock" min="0"
                 class="w-full mt-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
        </div>
      </div>
      <p *ngIf="error" class="text-red-500 text-xs">{{ error }}</p>
      <div class="flex gap-3 pt-2">
        <button type="button" (click)="save()"
                class="flex-1 py-2.5 bg-teal-600 text-white font-semibold rounded-xl hover:bg-teal-700">
          Save
        </button>
        <button type="button" (click)="cancel()"
                class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
