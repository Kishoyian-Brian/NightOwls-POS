<div class="p-4 md:p-8">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Settings</h1>
    <p class="text-gray-500 text-sm mt-1">Club configuration</p>
  </div>

  <div class="bg-white rounded-2xl shadow-md p-6 max-w-lg space-y-5">
    <div>
      <label class="text-xs font-semibold text-gray-500">Club Name</label>
      <input [(ngModel)]="settings.clubName"
             class="w-full mt-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500">Currency</label>
      <input [(ngModel)]="settings.currency"
             class="w-full mt-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
    </div>
    <div>
      <label class="text-xs font-semibold text-gray-500">Low Stock Threshold</label>
      <input type="number" [(ngModel)]="settings.lowStockThreshold" min="1"
             class="w-full mt-1 px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/>
    </div>
    <label class="flex items-center gap-3 cursor-pointer">
      <input type="checkbox" [(ngModel)]="settings.trackInventory"
             class="w-4 h-4 rounded border-gray-300 text-teal-600"/>
      <span class="text-sm text-gray-700">Track inventory (deduct stock on orders)</span>
    </label>
    <button type="button" (click)="save()"
            class="w-full py-2.5 bg-teal-600 text-white font-semibold rounded-xl hover:bg-teal-700">
      Save Settings
    </button>
    <p *ngIf="saved" class="text-green-600 text-sm text-center font-medium">Settings saved!</p>
  </div>
</div>
